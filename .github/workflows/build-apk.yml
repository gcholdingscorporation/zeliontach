name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which build to produce"
        required: true
        default: debug
        type: choice
        options: [ debug, release ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package set still includes the long-obsolete
      # 'tools' package, which no longer exists in the SDK repository and makes
      # sdkmanager exit 1. Install nothing by default and ask for what we need.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the SDK packages this build needs
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'debug' }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Both variants are signed with the committed sideload key, so a release
      # build needs no secrets. That key is not a publishing key.
      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: zelion-tach-apk
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 30

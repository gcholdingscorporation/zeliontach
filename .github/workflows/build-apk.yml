name: Build APK

# Every push builds a debug APK and uploads it as an Actions artifact, which
# expires in 30 days and needs a GitHub login to download.
#
# Run this by hand with `serve` ticked to get a one-tap download instead: the
# APK is published to a rolling prerelease at the `sideload` tag, which anyone
# can download with no login, at a URL that never changes:
#
#   https://github.com/gcholdingscorporation/zeliontach/releases/download/sideload/zelion-tach-sideload.apk
#
# That APK is signed with the committed throwaway `sideload.keystore`, so it is
# a test build and not a release. A real release comes from pushing a v-tag,
# which signs with the owner's key; see release.yml.

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Which build to produce"
        required: true
        default: debug
        type: choice
        options: [ debug, release ]
      serve:
        description: "Also publish it for download, no login needed (implies release)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      # Serving implies the release variant, since a debug APK is not what to
      # hand someone to fly with. Both variants are signed with the committed
      # sideload key, so neither needs a secret.
      - name: Decide what to build
        id: plan
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          VARIANT: ${{ inputs.variant }}
          SERVE: ${{ inputs.serve }}
        run: |
          variant=debug
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$SERVE" = "true" ] || [ "$VARIANT" = "release" ]; then
              variant=release
            fi
          fi
          case "$variant" in
            debug)   task=assembleDebug ;;
            release) task=assembleRelease ;;
          esac
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "Building the $variant variant with $task"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The action's default package set still includes the long-obsolete
      # 'tools' package, which no longer exists in the SDK repository and makes
      # sdkmanager exit 1. Install nothing by default and ask for what we need.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the SDK packages this build needs
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      # A served build takes its versionCode from the run number, so a later
      # one upgrades an earlier one in place instead of being refused. Run
      # numbers stay far below the codes a v-tag produces, so a real release
      # still upgrades over any of these. An ordinary CI build sets neither
      # variable and keeps versionCode 1 and versionName 1.0 as before.
      - name: Build the APK
        env:
          ZELION_VERSION_CODE: ${{ inputs.serve && github.run_number || '' }}
          ZELION_VERSION_NAME: ${{ inputs.serve && format('sideload-{0}', github.run_number) || '' }}
        run: ./gradlew ${{ steps.plan.outputs.task }} --no-daemon --stacktrace

      - name: Collect the APK
        id: apk
        env:
          VARIANT: ${{ steps.plan.outputs.variant }}
        run: |
          apk=$(find "app/build/outputs/apk/$VARIANT" -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::$VARIANT build produced no APK."
            exit 1
          fi
          mkdir -p out
          # A fixed name, so the download URL on the rolling prerelease below
          # is the same link every time.
          cp "$apk" "out/zelion-tach-sideload.apk"
          (cd out && sha256sum zelion-tach-sideload.apk)
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: zelion-tach-apk
          path: android/out/*.apk
          if-no-files-found: error
          retention-days: 30

      # One rolling prerelease rather than one per build: the tag is deleted
      # and recreated so the download link stays identical and old test builds
      # do not pile up next to real releases.
      - name: Publish it for download
        if: ${{ inputs.serve }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
          REF: ${{ github.ref_name }}
        run: |
          short="${SHA:0:7}"
          sha256=$(sha256sum android/out/zelion-tach-sideload.apk | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          A test build of Zelion Tach, taken from \`$REF\` at \`$short\`.

          **Install:** download \`zelion-tach-sideload.apk\` below and open it on the
          phone. Android will ask you to allow installing from this source. It needs
          Android 8.0 or newer and microphone permission.

          **This is not a release.** It is signed with the throwaway key committed in
          this repository, which anyone who has the repository also has. Use it to try
          the app, not to distribute it. A real release is signed with a key that is
          never committed and comes from pushing a v-tag.

          This prerelease is replaced in place by the next build served this way, so
          the link above always points at the newest one. Installing a newer test build
          over an older one works; moving between a test build and a real release does
          not, and needs the old copy uninstalled first.

          \`\`\`
          build    $RUN
          commit   $short
          SHA-256  $sha256
          \`\`\`

          Not an airworthiness instrument — a tuning aid for RC models only.
          NOTES

          if gh release view sideload > /dev/null 2>&1; then
            gh release delete sideload --yes --cleanup-tag
          fi
          gh release create sideload \
            --target "$SHA" \
            --title "Test build $short" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --prerelease \
            android/out/zelion-tach-sideload.apk

          echo "::notice::Served at https://github.com/$GITHUB_REPOSITORY/releases/download/sideload/zelion-tach-sideload.apk"

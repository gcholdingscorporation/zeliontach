name: Release APK

# Pushing a v-tag produces a signed APK attached to a GitHub Release, so a
# build outlives the 30-day expiry on the artifacts that `Build APK` uploads.
#
# The release is signed with the owner's real key, which never enters the
# repository. Set these four repository secrets before cutting the first tag
# (Settings -> Secrets and variables -> Actions):
#
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks/.keystore file
#                              (`base64 -w0 release.jks` on Linux,
#                               `base64 -i release.jks` on macOS)
#   ANDROID_KEYSTORE_PASSWORD  the store password
#   ANDROID_KEY_ALIAS          the alias of the key inside the store
#   ANDROID_KEY_PASSWORD       that key's password
#
# Keep the .jks itself somewhere safe and offline. Losing it means no future
# build can ever upgrade an installed copy in place.

on:
  push:
    tags: [ 'v*' ]
  # Lets a failed release be rebuilt for a tag that already exists, rather
  # than needing the tag deleted and pushed again.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Fail in five seconds rather than twenty minutes, and never quietly
      # fall back to the committed sideload key: an APK signed with a key
      # whose password sits in build.gradle is not a release.
      - name: Check the signing secrets are present
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for suffix in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!suffix}" ]; then
              missing="$missing ANDROID_$suffix"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Add them under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      - name: Work out the version from the tag
        id: version
        working-directory: .
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag="$RAW_TAG"
          name="${tag#v}"
          core="${name%%-*}"
          if ! printf '%s' "$core" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$tag' is not v<major>.<minor>.<patch>, optionally followed by -<suffix>. Example: v1.0.0 or v1.1.0-beta1."
            exit 1
          fi
          rest="${core#*.}"
          # 10# throughout: a part written 08 is decimal eight here, not an
          # invalid octal literal that would fail the arithmetic below.
          major=$(( 10#${core%%.*} ))
          minor=$(( 10#${rest%%.*} ))
          patch=$(( 10#${rest#*.} ))
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ]; then
            echo "::error::Minor and patch must each stay below 100 so the Android versionCode keeps increasing. Got '$core'."
            exit 1
          fi
          # versionCode has to rise with every release or Android refuses the
          # upgrade. The last two digits carry the prerelease: v2.0.0-beta1 is
          # 2000001, -beta2 is 2000002, and the final v2.0.0 is 2000099, so a
          # beta can be upgraded in place by the release that follows it.
          prerelease=false
          ordinal=99
          if [ "$name" != "$core" ]; then
            prerelease=true
            suffix="${name#*-}"
            digits=$(printf '%s' "$suffix" | tr -cd '0-9')
            ordinal=$(( 10#${digits:-0} ))
            if [ "$ordinal" -gt 98 ]; then
              echo "::error::Prerelease number in '$tag' must be 98 or lower."
              exit 1
            fi
          fi
          code=$(( (major * 10000 + minor * 100 + patch) * 100 + ordinal ))
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $tag as versionName $name, versionCode $code (prerelease: $prerelease)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # As in build-apk.yml: the action's default package set still includes
      # the long-obsolete 'tools' package, which makes sdkmanager exit 1.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install the SDK packages this build needs
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate the Gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --no-daemon

      - name: Decode the release keystore
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to anything. Re-encode the keystore with 'base64 -w0 release.jks' and paste the whole single line."
            exit 1
          fi
          # A wrong password or alias caught here reads far better than the
          # Gradle stacktrace it would otherwise cause.
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                       -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Could not open the keystore with the supplied password, or it holds no key called '$KEY_ALIAS'. Check ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS."
            exit 1
          fi

      - name: Build the signed release APK
        env:
          ZELION_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ZELION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ZELION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ZELION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ZELION_VERSION_NAME: ${{ steps.version.outputs.name }}
          ZELION_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK and verify its signature
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::assembleRelease produced no APK."
            exit 1
          fi
          mkdir -p out
          cp "$apk" "out/zelion-tach-$VERSION.apk"
          (cd out && sha256sum "zelion-tach-$VERSION.apk" > "zelion-tach-$VERSION.apk.sha256")
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs \
            "out/zelion-tach-$VERSION.apk"
          echo "sha256=$(cut -d' ' -f1 < "out/zelion-tach-$VERSION.apk.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
          SHA256: ${{ steps.apk.outputs.sha256 }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Zelion Tach $VERSION — acoustic head-speed meter for RC helicopters.

          **Install:** download \`zelion-tach-$VERSION.apk\` below and open it on the
          phone. Android will ask you to allow installing from this source. The app
          needs Android 8.0 or newer and microphone permission.

          Upgrading in place only works if the previous copy came from a release
          built here; a sideload build from the \`Build APK\` workflow is signed with
          a different key and has to be uninstalled first.

          \`\`\`
          SHA-256  $SHA256
          \`\`\`

          Not an airworthiness instrument — a tuning aid for RC models only.
          NOTES

          flags=(--title "Zelion Tach $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" "${flags[@]}"
            gh release upload "$TAG" android/out/zelion-tach-"$VERSION".apk \
                                     android/out/zelion-tach-"$VERSION".apk.sha256 --clobber
          else
            gh release create "$TAG" "${flags[@]}" \
              android/out/zelion-tach-"$VERSION".apk \
              android/out/zelion-tach-"$VERSION".apk.sha256
          fi
